# Render Blueprint
# Render 대시보드 > New > Blueprint 에서 이 저장소를 선택하면 아래 서비스가 만들어진다.
#
# Sandbox(develop 브랜치) 프론트엔드 정적 사이트 2개와 새 Core 백엔드(테스트용)를 정의한다.
# 사이트의 /api/* 요청은 아직 기존 서버(121.254.254.52:8200)로 넘긴다. 새 백엔드는 로그인 토큰이
# 기존 서버와 달라서, 주요 기능을 모두 옮긴 뒤 destination을 Core 주소로 한 번에 바꾼다.

services:
  # ── 사용자 웹 ───────────────────────────────────────────────
  - type: web
    runtime: static
    name: altosfunding-web-sandbox
    branch: develop
    rootDir: frontend
    buildCommand: npm ci && npm run build:web
    staticPublishPath: web/dist
    buildFilter:
      paths:
        - frontend/web/**
        - frontend/shared/**
        - frontend/package.json
        - frontend/package-lock.json
        - frontend/tsconfig.base.json
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Google reCAPTCHA site key. Google reCAPTCHA 관리 콘솔에서 onrender.com 도메인을 허용해야 로그인·가입이 동작한다.
      - key: VITE_RECAPTCHA_SITE_KEY
        sync: false
      # 이 사이트의 주소 (예: https://altosfunding-web-sandbox.onrender.com). Google 로그인과 og:image 에 쓰인다.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # 위에서부터 순서대로 적용된다. 실제 파일이 있으면 규칙보다 파일이 먼저다.
      - type: rewrite
        source: /api/*
        destination: http://121.254.254.52:8200/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  # ── 관리자 백오피스 ─────────────────────────────────────────
  - type: web
    runtime: static
    name: altosfunding-backoffice-sandbox
    branch: develop
    rootDir: frontend
    buildCommand: npm ci && npm run build:backoffice
    staticPublishPath: backoffice/dist
    buildFilter:
      paths:
        - frontend/backoffice/**
        - frontend/shared/**
        - frontend/package.json
        - frontend/package-lock.json
        - frontend/tsconfig.base.json
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_RECAPTCHA_SITE_KEY
        sync: false
    headers:
      # 관리자 화면은 검색엔진에 노출하지 않는다.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
    routes:
      - type: rewrite
        source: /api/*
        destination: http://121.254.254.52:8200/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  # ── 새 Core 백엔드 (테스트용) ──────────────────────────────
  # 지금은 사이트와 연결하지 않고 별도 주소(https://altosfunding-core-sandbox.onrender.com)로만 확인한다.
  # - API 문서: /docs, DB 연결 확인: /health/db
  # - 로컬 웹에서 시험할 때: frontend/web/.env.local 의 API_PROXY_TARGET 을 이 주소로 바꾼다.
  - type: web
    runtime: python
    name: altosfunding-core-sandbox
    branch: develop
    plan: free
    region: singapore
    rootDir: backend/services/core
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/services/core/**
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: sandbox
      # Supabase staging 프로젝트 > Connect > Session pooler 연결 문자열 (postgresql://... 그대로 넣어도 된다)
      - key: DATABASE_URL
        sync: false
      # JWT 서명, 2FA 비밀키 암호화 등에 쓰는 비밀 값. Render가 임의 값을 만들어 준다. 바꾸면 기존 로그인·2FA가 모두 무효가 된다.
      - key: SECRET_KEY
        generateValue: true
      # 외부 스케줄러가 챌린지 주기 작업(/api/v1/internal/jobs/challenges)을 부를 때 X-System-Api-Key 헤더로 보내는 값.
      - key: SYSTEM_API_KEY
        generateValue: true
      # Sumsub KYC. 비어 있으면 KYC 상태 조회만 되고 인증 시작은 "설정되지 않음" 오류가 난다.
      # 웹훅 주소: https://altosfunding-core-sandbox.onrender.com/api/v1/webhooks/sumsub
      - key: SUMSUB_APP_TOKEN
        sync: false
      - key: SUMSUB_SECRET_KEY
        sync: false
      - key: SUMSUB_WEBHOOK_SECRET
        sync: false
      - key: SUMSUB_LEVEL_NAME
        value: id-and-liveness
      # 비어 있으면 sandbox에서는 reCAPTCHA 검증을 건너뛴다.
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      # 메일 발송 방식. console: Render 로그로만 출력 / ses: AWS SES로 실제 발송.
      # ses로 바꾸려면 아래 AWS_ACCESS_KEY_ID·AWS_SECRET_ACCESS_KEY·EMAIL_FROM_ADDRESS를 먼저 넣고 대시보드에서 값을 ses로 바꾼다.
      - key: EMAIL_BACKEND
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-northeast-2
      # SES에서 인증된 발신 주소 (예: noreply@altosfunding.com)
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        value: Altos Funding
      - key: COOKIE_SECURE
        value: "true"
      # 비밀번호 재설정 메일 링크와 Google 로그인 뒤 돌아갈 기본 주소
      - key: WEB_BASE_URL
        value: https://altosfunding-web-sandbox.onrender.com
      # 로컬 웹(로컬 개발 서버)에서 Google 로그인을 시험할 수 있게 허용
      - key: FRONTEND_ALLOWED_ORIGINS
        value: https://local.altosfunding.com:5173
      # Google 로그인. 비어 있으면 /api/v1/auth/google/* 는 503을 돌려준다.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
